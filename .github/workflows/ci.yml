name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Needed by the vitest browser-mode project (chromium via playwright)
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      # `bun run format` is local-only; CI verifies formatting via prettier --check in `lint`
      - name: Lint (prettier + eslint)
        run: bun run lint

      - name: Check (svelte-check + TypeScript)
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
